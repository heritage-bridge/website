    <section class="page" id="page-research">
      <div class="wrap p-head">
        <div class="grid-12" style="align-items:end;margin-bottom:48px">
          <div style="grid-column:1/8">
            <span class="eyebrow">Research Library</span>
            <h1 class="serif display-l">Papers, reports and<br>field <i>knowledge</i></h1>
          </div>
          <div style="grid-column:9/13">
            <p class="body-muted" style="margin:0;font-weight:300">The library holds every written output of the
              initiative: peer-style papers, technical documentation, case studies and field reports. All items are
              openly accessible.</p>
          </div>
        </div>
      </div>
      <div class="wrap">
        <div class="filter-bar">
          <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg><input id="rSearch" type="search" placeholder="Search titles, authors, abstracts, tags…"></label>
          <div class="sel"><select id="rType">
              <option value="">All types</option>
            </select></div>
          <div class="sel"><select id="rCountry">
              <option value="">All locations</option>
              <option>Iraq</option>
              <option>Armenia</option>
            </select></div>
          <div class="sel"><select id="rSite">
              <option value="">All heritage sites</option>
            </select></div>
          <div class="sel"><select id="rTopic">
              <option value="">All topics</option>
            </select></div>
          <div class="sel"><select id="rSort">
              <option value="new">Newest first</option>
              <option value="old">Oldest first</option>
              <option value="az">Title A–Z</option>
            </select></div>
          <span class="count" id="rCount"></span>
        </div>
        <div style="padding-top:56px" id="libFeature"></div>
        <div class="lib-list" id="libList"></div>
      </div>
      <div class="section-tight"></div>
    </section>
